server {
    listen 80;
    listen [::]:80;
    server_name bauu-sanierung.de www.bauu-sanierung.de;
    root /var/www/bauu-sanierung;
    index index.html;

    location ~ /\.  { deny all; }
    location ^~ /server/ { deny all; }
    location = /README.md { deny all; }

    location / { try_files $uri $uri/ =404; }
}
